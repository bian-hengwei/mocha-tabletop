<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Gem tabletop fixture</title></head><body><div id="root"></div><script type="module">
import'/src/ui/style.css';import React from 'react';import{createRoot}from'react-dom/client';import{gems}from'/src/core/games/gems.ts';import{GemsTable}from'/src/ui/GemsTable.tsx';import{ActionDock,ActionSheet}from'/src/ui/Boards.tsx';
const h=React.createElement,params=new URLSearchParams(location.search),n=Number(params.get('n'))||4,players=Array.from({length:n},(_,i)=>({id:`p${i}`,name:['戴着眼镜的黑猫商人','阿岚','小雨','橘子'][i],avatar:['🦊','🐼','🐱','🐻'][i]}));

</script></body></html>
