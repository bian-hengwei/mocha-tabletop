name: Check Mocha Tabletop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Install browser for UI smoke tests
        run: npx playwright install --with-deps chromium
      - name: Check game entry, layouts, privacy and usability
        env:
          BASE_URL: http://127.0.0.1:5174
        run: |
          npm run dev -- --port 5174 --strictPort > "$RUNNER_TEMP/mocha-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          node tests/ui/app-usability.integration.mjs
          node tests/ui/language.integration.mjs
          node tests/ui/identity-portraits.integration.mjs
          node tests/ui/illustrated-games.integration.mjs
          node tests/ui/word-privacy.integration.mjs
          node tests/ui/werewolf-lineups.integration.mjs
          node tests/ui/proactive-new-games.integration.mjs
          node tests/ui/word-usability.integration.mjs
